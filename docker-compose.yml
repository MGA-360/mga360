version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mga360
      POSTGRES_PASSWORD: mga360
      POSTGRES_DB: mga360
    ports:
      - "5432:5432"
    volumes:
      - mga360_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mga360"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://mga360:mga360@db:5432/mga360?schema=public"
      JWT_ACCESS_SECRET: "troque-este-segredo-de-acesso"
      JWT_REFRESH_SECRET: "troque-este-segredo-de-refresh"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      PORT: 4000
      CORS_ORIGIN: "http://localhost:3000"
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - mga360_reports:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mga360_db_data:
  mga360_reports:
